<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Circular Path for Text -->
    <path id="stampTextPathTop" d="M 24 80 A 56 56 0 1 1 136 80" fill="none"/>
    <path id="stampTextPathBottom" d="M 136 80 A 56 56 0 1 1 24 80" fill="none"/>
    <linearGradient id="stampGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066B2"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Outer Starburst / Notched Border -->
  <circle cx="80" cy="80" r="76" stroke="#0066B2" stroke-width="2" stroke-dasharray="4,3" opacity="0.85"/>
  <circle cx="80" cy="80" r="71" stroke="#0066B2" stroke-width="1.2" opacity="0.9"/>
  <circle cx="80" cy="80" r="48" stroke="#0066B2" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
  <circle cx="80" cy="80" r="45" stroke="#0066B2" stroke-width="1.5" opacity="0.9"/>

  <!-- Curved Circular Text: FPT UNIVERSITY • VERIFIED -->
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#0066B2" letter-spacing="1.5">
    <textPath href="#stampTextPathTop" startOffset="50%" text-anchor="middle">
      TRƯỜNG ĐẠI HỌC FPT • FPTU
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7" font-weight="700" fill="#F27024" letter-spacing="1.8">
    <textPath href="#stampTextPathBottom" startOffset="50%" text-anchor="middle">
      ★ CHỨNG NHẬN KẾT QUẢ K20B ★
    </textPath>
  </text>

  <!-- Center Mascot Face + Stars -->
  <g transform="translate(80, 78)">
    <!-- Laurel Wreath in center -->
    <g stroke="#0066B2" stroke-width="1" fill="none" opacity="0.7">
      <path d="M -24 6 C -28 -6 -20 -18 -10 -22"/>
      <path d="M 24 6 C 28 -6 20 -18 10 -22"/>
      <!-- Leaves -->
      <ellipse cx="-22" cy="-4" rx="3.5" ry="1.8" transform="rotate(-30 -22 -4)" fill="#0066B2" opacity="0.3"/>
      <ellipse cx="-16" cy="-14" rx="3.5" ry="1.8" transform="rotate(-15 -16 -14)" fill="#0066B2" opacity="0.3"/>
      <ellipse cx="22" cy="-4" rx="3.5" ry="1.8" transform="rotate(30 22 -4)" fill="#0066B2" opacity="0.3"/>
      <ellipse cx="16" cy="-14" rx="3.5" ry="1.8" transform="rotate(15 16 -14)" fill="#0066B2" opacity="0.3"/>
    </g>

    <!-- Mini Toad Mascot Icon -->
    <g transform="translate(-16, -20) scale(0.26)">
      <!-- Eyes -->
      <circle cx="40" cy="30" r="14" fill="#FFA726" stroke="#B44000" stroke-width="2"/>
      <circle cx="80" cy="30" r="14" fill="#FFA726" stroke="#B44000" stroke-width="2"/>
      <circle cx="41" cy="30" r="10" fill="#FFFFFF"/>
      <circle cx="79" cy="30" r="10" fill="#FFFFFF"/>
      <circle cx="42" cy="30" r="6" fill="#1E293B"/>
      <circle cx="78" cy="30" r="6" fill="#1E293B"/>
      <circle cx="44" cy="28" r="2.5" fill="#FFFFFF"/>
      <circle cx="80" cy="28" r="2.5" fill="#FFFFFF"/>
      <!-- Head -->
      <path d="M 30 40 C 15 55 20 80 40 86 C 50 90 70 90 80 86 C 100 80 105 55 90 40 Z" fill="#FFA726" stroke="#B44000" stroke-width="2"/>
      <!-- Smile -->
      <path d="M 40 58 C 48 54 72 54 80 58 C 82 64 78 76 60 76 C 42 76 38 64 40 58 Z" fill="#B71C1C"/>
      <path d="M 50 68 C 54 62 66 62 70 68 Z" fill="#FF4081"/>
    </g>

    <!-- Ribbon / Banner across center bottom -->
    <g transform="translate(0, 14)">
      <rect x="-30" y="-7" width="60" height="14" rx="4" fill="#0066B2"/>
      <text x="0" y="3" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="6.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
        CÓC VÀNG
      </text>
    </g>

    <!-- Stars row -->
    <g fill="#FFB800" transform="translate(0, 24)">
      <polygon points="0,-4 1.2,-1 4.5,-1 2,1 3,4 0,2 -3,4 -2,1 -4.5,-1 -1.2,-1"/>
      <polygon points="-8,-4 -7,-1.5 -4.5,-1.5 -6.5,0.2 -5.5,2.7 -8,1.2 -10.5,2.7 -9.5,0.2 -11.5,-1.5 -9,-1.5" transform="scale(0.8)"/>
      <polygon points="8,-4 9,-1.5 11.5,-1.5 9.5,0.2 10.5,2.7 8,1.2 5.5,2.7 6.5,0.2 4.5,-1.5 7,-1.5" transform="scale(0.8)"/>
    </g>
  </g>
</svg>
