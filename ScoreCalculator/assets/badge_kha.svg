<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="khaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="khaShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0369A1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#khaShadow)">
    <!-- Medallion Base -->
    <g transform="translate(80, 72)">
      <circle cx="0" cy="0" r="48" fill="url(#khaGrad)" stroke="#0369A1" stroke-width="2"/>
      <circle cx="0" cy="0" r="42" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,2"/>

      <!-- Center Icon: Book / Quill / Star -->
      <g transform="translate(0, -2)">
        <polygon points="0,-18 5,-5 17,-5 7,3 11,16 0,8 -11,16 -7,3 -17,-5 -5,-5" fill="#0284C7"/>
        <polygon points="0,-13 3,-4 12,-4 5,2 8,11 0,6 -8,11 -5,2 -12,-4 -3,-4" fill="#BAE6FD"/>
      </g>
    </g>

    <!-- Banner Ribbon -->
    <g transform="translate(80, 122)">
      <polygon points="-65,-3 -75,10 -60,6 -50,5" fill="#075985"/>
      <polygon points="65,-3 75,10 60,6 50,5" fill="#075985"/>
      <rect x="-54" y="-10" width="108" height="20" rx="5" fill="#0284C7" stroke="#0369A1" stroke-width="1.2"/>
      <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
        SINH VIÊN KHÁ
      </text>
    </g>

    <!-- Score Pill -->
    <g transform="translate(80, 142)">
      <rect x="-30" y="-6" width="60" height="12" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1"/>
      <text x="0" y="3" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#0369A1" text-anchor="middle">
        7.00 - 7.99
      </text>
    </g>
  </g>
</svg>
