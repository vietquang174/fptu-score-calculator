<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="25%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="80%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="innerShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Outer Starburst Rays -->
    <g transform="translate(90, 80)" fill="#FDE68A" opacity="0.6">
      <circle cx="0" cy="0" r="68" fill="#FEF3C7" opacity="0.4"/>
      <polygon points="0,-72 16,-40 38,-60 28,-26 58,-32 38,-4 68,0 38,4 58,32 28,26 38,60 16,40 0,72 -16,40 -38,60 -28,26 -58,32 -38,4 -68,0 -38,-4 -58,-32 -28,-26 -38,-60 -16,-40"/>
    </g>

    <!-- Main Outer Gold Medallion Ring -->
    <circle cx="90" cy="80" r="60" fill="url(#goldPlate)" stroke="#B45309" stroke-width="2.5"/>
    <circle cx="90" cy="80" r="54" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
    
    <!-- Inner Dark Velvet / Royal Shield -->
    <circle cx="90" cy="80" r="48" fill="url(#innerShield)"/>

    <!-- Golden Laurels -->
    <g transform="translate(90, 84)" stroke="#F59E0B" stroke-width="1.5" fill="none">
      <path d="M -34 6 C -40 -12 -30 -30 -14 -36"/>
      <path d="M 34 6 C 40 -12 30 -30 14 -36"/>
      <!-- Leaves -->
      <ellipse cx="-32" cy="-6" rx="5" ry="2.5" transform="rotate(-35 -32 -6)" fill="#FCD34D"/>
      <ellipse cx="-24" cy="-20" rx="5" ry="2.5" transform="rotate(-20 -24 -20)" fill="#FCD34D"/>
      <ellipse cx="-12" cy="-30" rx="5" ry="2.5" transform="rotate(-5 -12 -30)" fill="#FCD34D"/>
      <ellipse cx="32" cy="-6" rx="5" ry="2.5" transform="rotate(35 32 -6)" fill="#FCD34D"/>
      <ellipse cx="24" cy="-20" rx="5" ry="2.5" transform="rotate(20 24 -20)" fill="#FCD34D"/>
      <ellipse cx="12" cy="-30" rx="5" ry="2.5" transform="rotate(5 12 -30)" fill="#FCD34D"/>
    </g>

    <!-- Cute Cóc Vàng Mascot Icon in Center -->
    <g transform="translate(90, 75) scale(0.42)">
      <!-- Sockets & Head -->
      <circle cx="-35" cy="-25" r="24" fill="#FFA726" stroke="#B44000" stroke-width="3"/>
      <circle cx="35" cy="-25" r="24" fill="#FFA726" stroke="#B44000" stroke-width="3"/>
      <circle cx="-34" cy="-25" r="17" fill="#FFFFFF"/>
      <circle cx="34" cy="-25" r="17" fill="#FFFFFF"/>
      <circle cx="-32" cy="-25" r="11" fill="#211103"/>
      <circle cx="32" cy="-25" r="11" fill="#211103"/>
      <circle cx="-29" cy="-28" r="4.5" fill="#FFFFFF"/>
      <circle cx="35" cy="-28" r="4.5" fill="#FFFFFF"/>
      <!-- Head shape -->
      <path d="M -50 0 C -70 30 -50 65 0 68 C 50 65 70 30 50 0 Z" fill="#FFA726" stroke="#B44000" stroke-width="3"/>
      <!-- Chin -->
      <path d="M -25 35 C -30 55 30 55 25 35 Z" fill="#FFE082"/>
      <!-- Smile -->
      <path d="M -30 25 C -15 40 15 40 30 25 C 20 48 -20 48 -30 25 Z" fill="#B71C1C"/>
      <path d="M -12 36 C -5 30 5 30 12 36 Z" fill="#FF4081"/>
      <!-- Cheeks -->
      <ellipse cx="-40" cy="25" rx="7" ry="4" fill="#FF5722" opacity="0.4"/>
      <ellipse cx="40" cy="25" rx="7" ry="4" fill="#FF5722" opacity="0.4"/>
      <!-- Tiny Crown on Head -->
      <polygon points="0,-50 14,-34 26,-48 18,-24 -18,-24 -26,-48 -14,-34" fill="#FFD54F" stroke="#B45309" stroke-width="2"/>
    </g>

    <!-- Top Crown / Trophy Crest -->
    <g transform="translate(90, 26)">
      <polygon points="0,-10 6,2 18,-2 10,12 -10,12 -18,-2 -6,2" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
      <circle cx="0" cy="2" r="3.5" fill="#EF4444"/>
    </g>

    <!-- Golden Banner / Ribbon Across Bottom -->
    <g transform="translate(90, 136)">
      <!-- Ribbon Tails -->
      <polygon points="-75,-4 -85,12 -70,8 -58,6" fill="#92400E"/>
      <polygon points="75,-4 85,12 70,8 58,6" fill="#92400E"/>
      <!-- Main Ribbon Body -->
      <rect x="-64" y="-12" width="128" height="24" rx="6" fill="url(#ribbonGrad)" stroke="#78350F" stroke-width="1.5"/>
      <rect x="-60" y="-8" width="120" height="16" rx="4" fill="none" stroke="#FDE68A" stroke-width="1" stroke-dasharray="2,1"/>
      
      <!-- Text -->
      <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        CÓC VÀNG
      </text>
    </g>

    <!-- Bottom Score Sub-Pill -->
    <g transform="translate(90, 158)">
      <rect x="-35" y="-7" width="70" height="14" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
      <text x="0" y="3" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#92400E" text-anchor="middle">
        TBM ≥ 9.60
      </text>
    </g>
  </g>
</svg>
