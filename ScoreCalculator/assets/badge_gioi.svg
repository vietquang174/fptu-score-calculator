<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gioiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="35%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="gioiShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#C2410C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#gioiShadow)">
    <!-- Medallion Base -->
    <g transform="translate(80, 72)">
      <!-- 12-Fluted Edge Circle -->
      <circle cx="0" cy="0" r="48" fill="url(#gioiGrad)" stroke="#C2410C" stroke-width="2"/>
      <circle cx="0" cy="0" r="42" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#FB923C" stroke-width="1" stroke-dasharray="3,2"/>

      <!-- Center Icon: Laurel + Number 1 / Star -->
      <polygon points="0,-20 5,-6 18,-6 8,3 12,17 0,8 -12,17 -8,3 -18,-6 -5,-6" fill="#EA580C"/>
      <!-- Inner detail -->
      <polygon points="0,-15 4,-5 14,-5 6,2 9,13 0,6 -9,13 -6,2 -14,-5 -4,-5" fill="#FED7AA"/>
      <circle cx="0" cy="0" r="4" fill="#C2410C"/>
    </g>

    <!-- Banner Ribbon -->
    <g transform="translate(80, 122)">
      <polygon points="-65,-3 -75,10 -60,6 -50,5" fill="#9A3412"/>
      <polygon points="65,-3 75,10 60,6 50,5" fill="#9A3412"/>
      <rect x="-54" y="-10" width="108" height="20" rx="5" fill="#EA580C" stroke="#9A3412" stroke-width="1.2"/>
      <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
        SINH VIÊN GIỎI
      </text>
    </g>

    <!-- Score Pill -->
    <g transform="translate(80, 142)">
      <rect x="-30" y="-6" width="60" height="12" rx="6" fill="#FFF7ED" stroke="#FB923C" stroke-width="1"/>
      <text x="0" y="3" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#C2410C" text-anchor="middle">
        8.00 - 8.99
      </text>
    </g>
  </g>
</svg>
