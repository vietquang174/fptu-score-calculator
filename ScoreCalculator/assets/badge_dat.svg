<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="datGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="35%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="datShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#047857" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#datShadow)">
    <!-- Medallion Base -->
    <g transform="translate(80, 72)">
      <circle cx="0" cy="0" r="48" fill="url(#datGrad)" stroke="#047857" stroke-width="2"/>
      <circle cx="0" cy="0" r="42" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="3,2"/>

      <!-- Center Icon: Big Checkmark with circle shield -->
      <circle cx="0" cy="0" r="22" fill="#10B981"/>
      <path d="M -9 0 L -3 6 L 10 -7" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Banner Ribbon -->
    <g transform="translate(80, 122)">
      <polygon points="-65,-3 -75,10 -60,6 -50,5" fill="#065F46"/>
      <polygon points="65,-3 75,10 60,6 50,5" fill="#065F46"/>
      <rect x="-54" y="-10" width="108" height="20" rx="5" fill="#059669" stroke="#047857" stroke-width="1.2"/>
      <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
        ĐẠT (PASS)
      </text>
    </g>

    <!-- Score Pill -->
    <g transform="translate(80, 142)">
      <rect x="-30" y="-6" width="60" height="12" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
      <text x="0" y="3" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#047857" text-anchor="middle">
        5.00 - 6.99
      </text>
    </g>
  </g>
</svg>
