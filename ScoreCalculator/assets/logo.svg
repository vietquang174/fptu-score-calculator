<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoMascotSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB03A"/>
      <stop offset="60%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="logoShirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066B2"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0066B2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Mascot Avatar Box (Left) -->
  <g transform="translate(6, 4)" filter="url(#logoShadow)">
    <!-- Rounded Background Squircle -->
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#F0F7FF" stroke="#BAE6FD" stroke-width="1.5"/>
    
    <!-- Mascot Bust inside clip -->
    <g transform="translate(4, 3) scale(0.24)">
      <!-- Sockets -->
      <circle cx="70" cy="56" r="24" fill="url(#logoMascotSkin)" stroke="#B44000" stroke-width="3"/>
      <circle cx="130" cy="56" r="24" fill="url(#logoMascotSkin)" stroke="#B44000" stroke-width="3"/>
      <!-- Sclera -->
      <circle cx="71" cy="56" r="17" fill="#FFFFFF"/>
      <circle cx="129" cy="56" r="17" fill="#FFFFFF"/>
      <!-- Pupils -->
      <circle cx="73" cy="56" r="11" fill="#211103"/>
      <circle cx="76" cy="53" r="4.5" fill="#FFFFFF"/>
      <circle cx="69" cy="61" r="2" fill="#FFFFFF"/>
      
      <circle cx="127" cy="56" r="11" fill="#211103"/>
      <circle cx="130" cy="53" r="4.5" fill="#FFFFFF"/>
      <circle cx="123" cy="61" r="2" fill="#FFFFFF"/>

      <!-- Eyelids -->
      <path d="M 54 42 C 62 36 78 38 84 44" stroke="#B44000" stroke-width="3" stroke-linecap="round"/>
      <path d="M 146 42 C 138 36 122 38 116 44" stroke="#B44000" stroke-width="3" stroke-linecap="round"/>

      <!-- Head Base -->
      <path d="M 50 72 C 34 96 38 132 68 142 C 84 148 116 148 132 142 C 162 132 166 96 150 72 C 138 52 62 52 50 72 Z" fill="url(#logoMascotSkin)" stroke="#B44000" stroke-width="3"/>

      <!-- Chin -->
      <path d="M 72 108 C 76 124 124 124 128 108 C 130 128 122 142 100 144 C 78 142 70 128 72 108 Z" fill="#FFE0B2"/>

      <!-- Smile -->
      <path d="M 66 100 C 76 94 124 94 134 100 C 137 106 132 128 100 130 C 68 128 63 106 66 100 Z" fill="#880E4F" stroke="#7A1D00" stroke-width="2"/>
      <path d="M 82 120 C 86 112 114 112 118 120 C 114 128 86 128 82 120 Z" fill="#FF4081"/>

      <!-- Cheeks -->
      <ellipse cx="54" cy="106" rx="8" ry="5" fill="#FF3D00" opacity="0.3"/>
      <ellipse cx="146" cy="106" rx="8" ry="5" fill="#FF3D00" opacity="0.3"/>

      <!-- Shirt with Collar -->
      <path d="M 58 138 L 48 180 L 152 180 L 142 138 Z" fill="url(#logoShirtGrad)" stroke="#BF360C" stroke-width="2"/>
      <path d="M 100 144 L 74 134 L 82 158 Z" fill="#FFFFFF"/>
      <path d="M 100 144 L 126 134 L 118 158 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography & Badges (Right) -->
  <g transform="translate(74, 14)">
    <!-- Top Row: App Title & Cohort Badge -->
    <g>
      <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="20" fill="url(#logoTextGrad)" letter-spacing="-0.5">
        FPTU <tspan fill="#F27024">SCORE</tspan> CALC
      </text>

      <!-- Cohort Pill Badge -->
      <g transform="translate(142, 4)">
        <rect x="0" y="0" width="56" height="18" rx="9" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
        <text x="28" y="12.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#EA580C" text-anchor="middle">
          K20B • SE
        </text>
      </g>
    </g>

    <!-- Subtitle: Elegant & Informative -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#64748B" letter-spacing="-0.1">
      Tính Điểm Kỳ &amp; Vinh Danh Cóc Vàng
    </text>
  </g>
</svg>
