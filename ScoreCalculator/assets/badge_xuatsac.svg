<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="xsGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="xsShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="xsShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#B45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#xsShadow)">
    <!-- Medallion Outer Star -->
    <g transform="translate(80, 72)">
      <!-- 8-Point Star Base -->
      <polygon points="0,-52 14,-36 36,-36 36,-14 52,0 36,14 36,36 14,36 0,52 -14,36 -36,36 -36,14 -52,0 -36,-14 -36,-36 -14,-36" fill="url(#xsGoldGrad)" stroke="#B45309" stroke-width="2"/>
      
      <!-- Circle Inset -->
      <circle cx="0" cy="0" r="38" fill="url(#xsShield)" stroke="#D97706" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2"/>

      <!-- Center Medal Emblem: Star + Leaves -->
      <polygon points="0,-22 6,-8 22,-8 10,2 14,18 0,9 -14,18 -10,2 -22,-8 -6,-8" fill="#F59E0B" stroke="#B45309" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="5" fill="#EF4444"/>
      <circle cx="-1.5" cy="-1.5" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Banner Ribbon -->
    <g transform="translate(80, 122)">
      <!-- Tails -->
      <polygon points="-65,-3 -75,10 -60,6 -50,5" fill="#92400E"/>
      <polygon points="65,-3 75,10 60,6 50,5" fill="#92400E"/>
      <!-- Body -->
      <rect x="-54" y="-10" width="108" height="20" rx="5" fill="#F59E0B" stroke="#B45309" stroke-width="1.2"/>
      <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
        XUẤT SẮC
      </text>
    </g>

    <!-- Score Pill -->
    <g transform="translate(80, 142)">
      <rect x="-30" y="-6" width="60" height="12" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
      <text x="0" y="3" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#B45309" text-anchor="middle">
        TBM ≥ 9.00
      </text>
    </g>
  </g>
</svg>
